<!doctype html>
<html lang="fa" dir="rtl" data-accent="orange">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#FFD400">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>بولت ژورنال</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<style>
/* ============ NEO-BRUTALISM TOKENS ============ */
:root{
  --bg:#FDF4E6; --paper:#FFFFFF; --ink:#111111; --muted:#7A7168;
  --acc:#FF5C00; --acc-soft:#FFD2B0;
  --g:#00C46A; --y:#FFD400; --b:#4361FF; --p:#FF3D7F;
  --lg:#A6F0C8; --lb:#C2D0FF; --lp:#FFC9DD;
  --bd:3px; --sh:6px 6px 0 var(--ink); --shs:4px 4px 0 var(--ink);
  --nav:72px; --r:0px;
}
[data-accent="blue"]{--acc:#4361FF;--acc-soft:#C9D2FF}
[data-accent="pink"]{--acc:#FF3D7F;--acc-soft:#FFC9DD}
[data-accent="green"]{--acc:#00A65A;--acc-soft:#A6F0C8}
[data-accent="black"]{--acc:#111111;--acc-soft:#D9D9D9}

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{
  font-family:"Vazirmatn",'IRANSansX','IRANSans',Tahoma,'Segoe UI',sans-serif;
  color:var(--ink); background-color:var(--bg);
  background-image:radial-gradient(rgba(17,17,17,.13) 1.2px, transparent 1.2px);
  background-size:24px 24px; background-attachment:fixed;
  -webkit-font-smoothing:antialiased; overscroll-behavior-y:contain;
  font-size:15px; line-height:1.55;
}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{border:none;background:none;cursor:pointer}

/* ============ SHELL ============ */
.app{max-width:560px;margin:0 auto;min-height:100vh;position:relative}
.topbar{
  position:sticky;top:0;z-index:30;background:var(--bg);
  border-bottom:var(--bd) solid var(--ink);
  padding:10px 12px;display:flex;align-items:center;gap:8px;
}
.brand{
  background:var(--y);border:var(--bd) solid var(--ink);box-shadow:var(--shs);
  padding:4px 10px;font-weight:900;font-size:15px;letter-spacing:-.3px;white-space:nowrap;
}
.brand i{font-style:normal;color:var(--acc)}
.spacer{flex:1}
.iconbtn{
  width:38px;height:38px;display:grid;place-items:center;flex:0 0 38px;
  border:var(--bd) solid var(--ink);background:var(--paper);box-shadow:var(--shs);
}
.iconbtn:active{transform:translate(3px,3px);box-shadow:none}
.iconbtn.hot{background:var(--acc-soft)}
.iconbtn svg{width:20px;height:20px;display:block}

main{padding:12px 12px calc(var(--nav) + 34px + env(safe-area-inset-bottom))}
.datechip{
  display:inline-block;background:var(--paper);border:var(--bd) solid var(--ink);
  box-shadow:var(--shs);padding:3px 9px;font-weight:800;font-size:12px;margin:8px 0 0;
}

/* ============ CARDS ============ */
.card{
  background:var(--paper);border:var(--bd) solid var(--ink);box-shadow:var(--sh);
  padding:13px;margin-bottom:14px;position:relative;
}
.card.flat{box-shadow:var(--shs)}
.card.acc{background:var(--acc-soft)}
.card.y{background:var(--y)}
.card-title{font-weight:900;font-size:14px;display:flex;align-items:center;gap:8px;margin-bottom:8px}
.card-title .num{
  background:var(--ink);color:var(--paper);font-size:11px;padding:2px 7px;font-weight:900;
}
.lab{font-size:11px;font-weight:900;color:var(--muted);margin:10px 0 5px;letter-spacing:.2px}

/* ============ BUTTONS ============ */
.btn{
  font-weight:800;border:var(--bd) solid var(--ink);background:var(--paper);
  padding:9px 14px;box-shadow:var(--shs);font-size:14px;
  transition:transform .05s, box-shadow .05s;
}
.btn:active{transform:translate(4px,4px);box-shadow:none}
.btn.y{background:var(--y)} .btn.g{background:var(--g)}
.btn.b{background:var(--b);color:#fff} .btn.p{background:var(--p);color:#fff}
.btn.acc{background:var(--acc);color:#fff}
.btn.dark{background:var(--ink);color:var(--paper)}
.btn.danger{background:var(--p);color:#fff}
.btn.wide{width:100%;display:block;margin-bottom:12px}
.btn.grow{flex:1}
.btn.ico{width:40px;height:40px;padding:0;display:grid;place-items:center;font-size:20px;font-weight:900;flex:0 0 40px}
.btn.sm{padding:6px 10px;font-size:12px;box-shadow:3px 3px 0 var(--ink)}
.btn[disabled]{opacity:.45;pointer-events:none}

/* ============ INPUTS ============ */
.inp{
  width:100%;border:var(--bd) solid var(--ink);background:var(--paper);
  padding:10px 11px;font-size:16px;font-weight:600;outline:none;
}
.inp:focus{box-shadow:var(--shs);background:#FFFBEC}
textarea.inp{resize:vertical;line-height:1.6}
.inp.t{width:auto;min-width:100px;flex:1}
select.inp{flex:1;font-weight:800}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px}
.mini{display:flex;align-items:center;gap:6px;font-weight:800;font-size:13px;white-space:nowrap}
.mini input[type=checkbox]{width:20px;height:20px;accent-color:var(--acc)}
.mini input[type=checkbox]{appearance:none;border:var(--bd) solid var(--ink);background:var(--paper)}
.mini input[type=checkbox]:checked{background:var(--acc);box-shadow:inset 0 0 0 3px var(--paper)}

/* ============ CHIPS ============ */
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:7px 0}
.chip{
  border:var(--bd) solid var(--ink);background:var(--paper);padding:6px 11px;
  font-weight:800;font-size:13px;box-shadow:3px 3px 0 var(--ink);
}
.chip:active{transform:translate(3px,3px);box-shadow:none}
.chip[aria-pressed="true"]{background:var(--y);transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.chip.star[aria-pressed="true"]{background:var(--y)}
.chip.bang[aria-pressed="true"]{background:var(--p);color:#fff}
.chip.eye[aria-pressed="true"]{background:var(--b);color:#fff}

/* ============ ENTRY ============ */
.ent{
  display:flex;gap:9px;align-items:flex-start;background:var(--paper);
  border:var(--bd) solid var(--ink);box-shadow:var(--shs);padding:9px;margin-bottom:10px;
}
.ent.done{background:#F2F0EC}
.ent.done .txt{text-decoration:line-through;color:var(--muted)}
.ent.mig{background:#F2F0EC;opacity:.85}
.ent.mig .txt{color:var(--muted);font-style:italic}
.sym{
  width:40px;height:40px;flex:0 0 40px;display:grid;place-items:center;
  border:var(--bd) solid var(--ink);font-weight:900;font-size:22px;background:var(--paper);
}
.sym:active{transform:translate(2px,2px)}
.sym.task{background:var(--paper)}
.sym.done{background:var(--g);color:#fff}
.sym.event{background:var(--lb)}
.sym.note{background:#EFEDE8}
.sym.mig{background:var(--acc);color:#fff}
.sym.sched{background:var(--y)}
.body{flex:1;min-width:0}
.txt{font-weight:700;font-size:15px;word-break:break-word;line-height:1.45}
.note-body{font-size:13px;color:var(--muted);margin-top:3px;white-space:pre-wrap;word-break:break-word}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.tag{
  font-size:11px;font-weight:900;border:2px solid var(--ink);padding:1px 7px;background:var(--paper);
}
.tag.star{background:var(--y)} .tag.bang{background:var(--p);color:#fff} .tag.eye{background:var(--b);color:#fff}
.tag.rem{background:var(--acc-soft)}
.tag.mv{background:#EFEDE8;color:var(--muted)}
.menu{
  flex:0 0 30px;width:30px;height:30px;display:grid;place-items:center;
  border:2px solid var(--ink);background:var(--paper);font-weight:900;font-size:15px;line-height:1;
}
.menu:active{transform:translate(2px,2px)}

/* ============ STATS / BARS ============ */
.datebar{display:flex;align-items:center;gap:8px;padding:9px}
.dbig{flex:1;text-align:center;font-weight:900;font-size:17px;letter-spacing:-.3px}
.stats{display:flex;gap:8px;margin-bottom:14px}
.st{
  flex:1;background:var(--paper);border:var(--bd) solid var(--ink);box-shadow:var(--shs);
  padding:6px 4px;text-align:center;font-size:11px;font-weight:800;
}
.st b{display:block;font-size:20px;font-weight:900;line-height:1.1}
.st.a{background:var(--y)} .st.b{background:var(--lg)}
.empty{
  text-align:center;padding:22px 10px;font-weight:800;color:var(--muted);
  border:3px dashed rgba(17,17,17,.35);background:rgba(255,255,255,.5);font-size:13px;
}

/* ============ CALENDAR ============ */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .h{text-align:center;font-size:10px;font-weight:900;color:var(--muted);padding-bottom:2px}
.cal .d{
  aspect-ratio:1;display:grid;place-items:center;border:2px solid var(--ink);
  background:var(--paper);font-weight:800;font-size:13px;position:relative;
}
.cal .d:active{transform:translate(2px,2px)}
.cal .d.out{background:transparent;border-color:rgba(17,17,17,.18);color:var(--muted)}
.cal .d.today{background:var(--acc-soft)}
.cal .d.sel{background:var(--ink);color:var(--paper)}
.cal .d .dot{position:absolute;bottom:3px;width:7px;height:7px;background:var(--acc);border:1.5px solid var(--ink);border-radius:50%}
.cal .d.sel .dot{background:var(--y);border-color:var(--paper)}
.monhead{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.monhead .mn{flex:1;text-align:center;font-weight:900;font-size:16px}

/* ============ INDEX ============ */
.idx{display:flex;align-items:baseline;gap:6px;padding:9px 4px;border-bottom:2px dotted rgba(17,17,17,.4);font-weight:700;font-size:14px}
.idx:last-child{border-bottom:none}
.idx .lead{flex:1;border-bottom:2px dotted rgba(17,17,17,.35);transform:translateY(-4px);min-width:12px}
.idx .pg{background:var(--ink);color:var(--paper);font-size:12px;font-weight:900;padding:1px 8px}
.idx .ty{font-size:11px;font-weight:900;border:2px solid var(--ink);padding:0 6px;background:var(--paper)}
.idx .ty.daily{background:var(--y)} .idx .ty.monthly{background:var(--lb)}
.idx .ty.future{background:var(--lg)} .idx .ty.col{background:var(--lp)}

/* ============ COLLECTIONS ============ */
.colcard{display:flex;align-items:center;gap:10px;width:100%;text-align:right;margin-bottom:12px}
.colcard .t{flex:1;font-weight:900;font-size:15px}
.colcard .c{font-size:12px;font-weight:800;color:var(--muted)}

/* ============ TABBAR ============ */
.tabbar{
  position:fixed;bottom:0;left:0;right:0;z-index:40;display:flex;
  background:var(--paper);border-top:var(--bd) solid var(--ink);
  height:calc(var(--nav) + env(safe-area-inset-bottom));
  padding-bottom:env(safe-area-inset-bottom);
}
.tab{
  flex:1;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:2px;font-size:10.5px;font-weight:900;color:var(--muted);
}
.tab svg{width:22px;height:22px;display:block}
.tab.on{color:var(--ink);background:var(--y)}
.tab.on::before{content:"";position:absolute;top:0;left:0;right:0;height:5px;background:var(--ink)}

/* ============ SHEET ============ */
#sheet{position:fixed;inset:0;z-index:60;display:none;align-items:flex-end}
#sheet.open{display:flex}
.sheet-bg{position:absolute;inset:0;background:rgba(17,17,17,.5)}
.sheet{
  position:relative;width:100%;max-width:560px;margin:0 auto;max-height:90vh;overflow-y:auto;
  background:var(--bg);border:var(--bd) solid var(--ink);border-bottom:none;
  box-shadow:0 -8px 0 var(--ink);padding:0 14px calc(22px + env(safe-area-inset-bottom));
  animation:up .18s ease-out;
}
@keyframes up{from{transform:translateY(30px);opacity:.6}to{transform:none;opacity:1}}
.grab{width:56px;height:5px;background:var(--ink);margin:9px auto 4px}
.sheethead{display:flex;align-items:center;gap:8px;padding:4px 0 10px;border-bottom:var(--bd) solid var(--ink);margin-bottom:6px}
.sheethead h3{flex:1;font-weight:900;font-size:16px}
.sheet .card{box-shadow:var(--shs)}

/* ============ TOAST ============ */
#toast{
  position:fixed;left:12px;right:12px;z-index:80;
  bottom:calc(var(--nav) + 14px + env(safe-area-inset-bottom));
  background:var(--ink);color:var(--paper);border:var(--bd) solid var(--ink);
  box-shadow:var(--sh);padding:12px 14px;font-weight:800;font-size:14px;
  opacity:0; transform:translateY(40px); pointer-events:none;
  transition:opacity .2s, transform .25s cubic-bezier(.2,.9,.3,1.2);
}
#toast.show{opacity:1; transform:translateY(0); pointer-events:auto}
#toast .s{display:block;font-size:12px;font-weight:600;opacity:.85;margin-top:2px}
.hidden{display:none!important}
</style>
</head>
<body>

<div class="app">
  <header class="topbar">
    <div class="brand">●&nbsp;بولت&nbsp;<i>ژورنال</i></div>
    <div class="spacer"></div>
    <button class="iconbtn" data-act="guide" title="راهنما">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6"><path d="M4 5h16M4 12h16M4 19h9"/></svg>
    </button>
    <button class="iconbtn" data-act="notif" title="اعلان‌ها">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6"><path d="M6 9a6 6 0 0 1 12 0c0 4 1.5 5.5 2 6H4c.5-.5 2-2 2-6Z"/><path d="M10 19a2 2 0 0 0 4 0"/></svg>
    </button>
    <button class="iconbtn" data-act="settings" title="تنظیمات">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6"><circle cx="12" cy="12" r="3.2"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M19.1 4.9 17 7M7 17l-2.1 2.1"/></svg>
    </button>
  </header>

  <main id="view"></main>

  <nav class="tabbar">
    <button class="tab" data-tab="daily"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="5.4" fill="currentColor"/></svg><span>امروز</span></button>
    <button class="tab" data-tab="monthly"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="8" height="8" fill="currentColor"/><rect x="13" y="3" width="8" height="8" fill="currentColor" opacity=".45"/><rect x="3" y="13" width="8" height="8" fill="currentColor" opacity=".45"/><rect x="13" y="13" width="8" height="8" fill="currentColor"/></svg><span>ماهانه</span></button>
    <button class="tab" data-tab="future"><svg viewBox="0 0 24 24"><path d="M5 4 L20 12 L5 20 Z" fill="currentColor"/></svg><span>آینده</span></button>
    <button class="tab" data-tab="index"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="3" fill="currentColor"/><rect x="3" y="10.5" width="18" height="3" fill="currentColor"/><rect x="3" y="17" width="11" height="3" fill="currentColor"/></svg><span>فهرست</span></button>
    <button class="tab" data-tab="collections"><svg viewBox="0 0 24 24"><path d="M12 2.5 14.8 9h6.7l-5.4 4.2 2 6.8L12 16.5 5.9 20l2-6.8L2.5 9h6.7Z" fill="currentColor"/></svg><span>کالکشن</span></button>
  </nav>
</div>

<div id="sheet"><div class="sheet-bg" data-act="close"></div>
  <div class="sheet">
    <div class="grab"></div>
    <div class="sheethead"><h3 id="sheetTitle">—</h3><button class="btn sm dark" data-act="close">بستن</button></div>
    <div id="sheetBody"></div>
  </div>
</div>

<div id="toast"></div>

<script>
/* ==========================================================
   بولت ژورنال — متد رایدر کارول
   ========================================================== */
const KEY='bujo.v1';
const $= (s,r=document)=>r.querySelector(s);
const $$= (s,r=document)=>[...r.querySelectorAll(s)];
const uid= ()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const pad= n=>String(n).padStart(2,'0');
const esc= s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ---------- تقویم خورشیدی (از طریق Intl) ---------- */
const PD='۰۱۲۳۴۵۶۷۸۹';
const faNum= n=>String(n).replace(/\d/g,d=>PD[+d]);
const MONTHS=['فروردین','اردیبهشت','خرداد','تیر','مرداد','شهریور','مهر','آبان','آذر','دی','بهمن','اسفند'];
const WDAYS=['شنبه','یکشنبه','دوشنبه','سه‌شنبه','چهارشنبه','پنجشنبه','جمعه'];
const DTF=new Intl.DateTimeFormat('en-u-ca-persian-nu-latn',{year:'numeric',month:'2-digit',day:'2-digit'});
function jp(d){const o={};DTF.formatToParts(d).forEach(p=>{if(p.type!=='literal')o[p.type]=p.value});return{y:+o.year,m:+o.month,d:+o.day};}
const jkey= d=>{const p=jp(d);return p.y+'-'+pad(p.m)+'-'+pad(p.d);};
const mkey= d=>{const p=jp(d);return p.y+'-'+pad(p.m);};
const wdIdx= d=>(d.getDay()+1)%7;                      /* شنبه = 0 */
const noon= d=>{const x=new Date(d);x.setHours(12,0,0,0);return x;};
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x;};
const cmpj=(a,b)=>(a.y-b.y)||(a.m-b.m)||(a.d-b.d);
function jdate(y,m,d){
  const base=noon(new Date()), p0=jp(base), A=p=>p.y*365.2422+(p.m-1)*30.44+p.d;
  let dt=addDays(base,Math.round(A({y,m,d})-A(p0))), g=0;
  while(cmpj(jp(dt),{y,m,d})<0 && g++<60) dt=addDays(dt,1);
  while(cmpj(jp(dt),{y,m,d})>0 && g++<60) dt=addDays(dt,-1);
  return dt;
}
const fromKey=k=>{const[y,m,d]=k.split('-').map(Number);return jdate(y,m,d);};
function jDaysInMonth(y,m){let d=jdate(y,m,1),n=0;while(n<32 && jp(d).y===y && jp(d).m===m){d=addDays(d,1);n++;}return n;}
function addJMonths(d,n){
  const p=jp(d); let m=p.m+n, y=p.y;
  while(m>12){m-=12;y++;} while(m<1){m+=12;y--;}
  return jdate(y,m,Math.min(p.d,jDaysInMonth(y,m)));
}
function addJMonthKey(mk,n){
  const [y,m]=mk.split('-').map(Number); let mm=m+n, yy=y;
  while(mm>12){mm-=12;yy++;} while(mm<1){mm+=12;yy--;}
  return yy+'-'+pad(mm);
}
const niceJ =k=>{const[y,m,d]=k.split('-').map(Number);return faNum(d)+' '+MONTHS[m-1]+' '+faNum(y);};
const niceJM=k=>{const[y,m]=k.split('-').map(Number);return MONTHS[m-1]+' '+faNum(y);};

/* ---------- نمادها و نشانه‌ها ---------- */
const SYMS={task:'•',done:'×',mig:'>',sched:'<',event:'○',note:'—'};
const SYML={task:'وظیفه',done:'انجام‌شده',mig:'منتقل‌شده',sched:'برنامه‌ریزی‌شده',event:'رویداد',note:'یادداشت'};
const SIGS={star:{c:'★',l:'مهم',cls:'star'},bang:{c:'!',l:'ایده',cls:'bang'},eye:{c:'👁',l:'بررسی',cls:'eye'}};

/* ---------- وضعیت ---------- */
const DEF={v:1,nextPage:1,pages:{},daily:{},monthly:{},future:{},collections:[],
  settings:{sound:true,dailyRem:{on:false,time:'21:00',last:''},accent:'orange'},seenGuide:false};
let S;
try{
  const p=JSON.parse(localStorage.getItem(KEY)||'{}');
  S=Object.assign({},DEF,p,{settings:Object.assign({},DEF.settings,p.settings||{})});
  S.daily=S.daily||{};S.monthly=S.monthly||{};S.future=S.future||{};S.collections=S.collections||[];S.pages=S.pages||{};
}catch(e){S=JSON.parse(JSON.stringify(DEF));}
const todayKey=()=>jkey(new Date());
const UI={tab:'daily',day:todayKey(),month:mkey(new Date()),col:null,fut:6};
let compSym='task', compSig=null;
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){toast('خطا در ذخیره‌سازی','فضای مرورگر پر است');}};

/* ---------- لیست‌ها بر اساس زمینه ---------- */
function getList(ctx){
  const [t,k]=ctx.split(':');
  if(t==='daily')   return S.daily[k]||[];
  if(t==='monthly') return S.monthly[k]||[];
  if(t==='future')  return S.future[k]||[];
  if(t==='col'){const c=S.collections.find(x=>x.id===k);return c?(c.entries||[]):[];}
  return [];
}
function ensureList(ctx){
  const [t,k]=ctx.split(':');
  if(t==='daily')   return S.daily[k]   || (S.daily[k]=[]);
  if(t==='monthly') return S.monthly[k] || (S.monthly[k]=[]);
  if(t==='future')  return S.future[k]  || (S.future[k]=[]);
  if(t==='col'){const c=S.collections.find(x=>x.id===k);return c?(c.entries||(c.entries=[])):[];}
  return [];
}
function removeFrom(ctx,id){
  const [t,k]=ctx.split(':'); let L;
  if(t==='col'){const c=S.collections.find(x=>x.id===k);L=c&&c.entries;} else L=S[t][k];
  if(!L)return; const i=L.findIndex(e=>e.id===id); if(i>-1)L.splice(i,1);
}
function ensurePage(ctx){ if(!S.pages[ctx]) S.pages[ctx]=S.nextPage++; return S.pages[ctx]; }
/* فقط وقتی صفحه واقعاً وجود دارد شماره نشان بده (از شماره‌گذاریِ صفحات خالی جلوگیری می‌کند) */
const pageNo= ctx=> S.pages[ctx]||null;
const pageBadge= ctx=>{const p=pageNo(ctx);return p?`<span class="num">صفحه ${faNum(p)}</span>`:'';};
function ctxTitle(ctx){
  const [t,k]=ctx.split(':');
  if(t==='daily')   return 'لاگ روزانه — '+niceJ(k);
  if(t==='monthly') return 'لاگ ماهانه — '+niceJM(k);
  if(t==='future')  return 'لاگ آینده — '+niceJM(k);
  if(t==='col'){const c=S.collections.find(x=>x.id===k);return c?c.title:'(حذف‌شده)';}
  return '';
}
function ctxType(ctx){return ctx.split(':')[0];}

/* ==========================================================
   رندر
   ========================================================== */
function render(){
  const v=$('#view');
  v.innerHTML =
    UI.tab==='daily'   ? viewDaily() :
    UI.tab==='monthly' ? viewMonthly() :
    UI.tab==='future'  ? viewFuture() :
    UI.tab==='index'   ? viewIndex() :
    UI.tab==='collections' ? (UI.col? viewCollection(UI.col) : viewCollections()) : '';
  $$('.tab').forEach(b=>b.classList.toggle('on',b.dataset.tab===UI.tab));
  syncComposer();
  save();
}
function syncComposer(){
  $$('[data-sym]').forEach(b=>b.setAttribute('aria-pressed', b.dataset.sym===compSym));
  $$('[data-sig]').forEach(b=>b.setAttribute('aria-pressed', (compSig||'')===b.dataset.sig));
}

/* ---------- آیتم ورودی ---------- */
function entryHTML(e,ctx){
  const sig = e.sig && SIGS[e.sig] ? `<span class="tag ${SIGS[e.sig].cls}">${SIGS[e.sig].c} ${SIGS[e.sig].l}</span>`:'';
  const rem = e.rem ? `<span class="tag rem">یادآور ${niceJ(e.rem.date)} · ${faNum(e.rem.time)}</span>`:'';

  const cls = e.sym==='done'?'done' : (e.sym==='mig'||e.sym==='sched')?'mig':'';
  return `<div class="ent ${cls}" data-id="${e.id}" data-ctx="${ctx}">
    <button class="sym ${e.sym}" data-act="toggle" title="${SYML[e.sym]}">${SYMS[e.sym]}</button>

/* ---------- امروز ---------- */
function viewDaily(){

  <div class="card datebar flat">

/* ---------- ماهانه ---------- */
function monthCal(mk){
  const first=jdate(+mk.split('-')[0], +mk.split('-')[1], 1);
  const lead=wdIdx(first), n=jDaysInMonth(+mk.split('-')[0], +mk.split('-')[1]);
  let h='';
  WDAYS.forEach(w=>h+=`<div class="h">${w.slice(0,1)}</div>`);
  for(let i=0;i<lead;i++) h+=`<div class="d out"></div>`;
  const tk=todayKey();
  for(let i=1;i<=n;i++){
    const k=mk+'-'+pad(i);
    const has=(S.daily[k]||[]).length>0;
    h+=`<div class="d ${k===tk?'today':''} ${k===UI.day?'sel':''}" data-act="pick-day" data-k="${k}">${faNum(i)}${has?'<span class="dot"></span>':''}</div>`;
  }
  return `<div class="cal">${h}</div>`;
}
function viewMonthly(){
  const mk=UI.month, L=getList('monthly:'+mk);
  const openN=countOpenMonth(mk);
  return `
  <div class="card">
    <div class="monhead">
      <button class="btn ico" data-act="mon-prev">›</button>
      <div class="mn">${niceJM(mk)}</div>
      <button class="btn ico" data-act="mon-next">‹</button>
    </div>
    ${monthCal(mk)}
  </div>
  <div class="card">
    <div class="card-title">لاگ ماهانه ${pageBadge('monthly:'+mk)}</div>
    ${L.length? L.map(e=>entryHTML(e,'monthly:'+mk)).join('') : '<div class="empty">کارهای این ماه اینجا می‌آیند</div>'}
    ${miniComposer('monthly:'+mk,'افزودن به لاگ ماهانه…')}
  </div>
  <button class="btn wide ${openN?'y':'dark'}" data-act="migrate">انتقال ماهانه ${openN?`（${faNum(openN)} مورد باز）`:'（چیزی برای انتقال نیست）'}</button>
  <div class="card flat" style="background:#FFFBEC">
    <div style="font-size:12.5px;font-weight:700;line-height:1.7">
      <b>انتقال (Migration):</b> در پایان ماه، کارهای باز و یادداشت‌های زنده را مرور کن. هر مورد یا انجام شده،
      یا با <b>&gt;</b> به ماه بعد منتقل می‌شود، یا با <b>&lt;</b> در یک روز مشخص برنامه‌ریزی می‌شود،
      یا به‌عنوان بی‌ربط حذف می‌گردد.
    </div>
  </div>`;
}
function countOpenMonth(mk){return openMonthItems(mk).length;}
function openMonthItems(mk){
  const out=[];
  Object.keys(S.daily).filter(k=>k.slice(0,7)===mk).forEach(k=>{
    (S.daily[k]||[]).forEach(e=>{if(e.sym==='task'||e.sym==='note')out.push({ctx:'daily:'+k,e});});
  });
  (S.monthly[mk]||[]).forEach(e=>{if(e.sym==='task'||e.sym==='note')out.push({ctx:'monthly:'+mk,e});});
  return out;
}

/* ---------- آینده ---------- */
function viewFuture(){
  let mk=mkey(new Date()); let h='';
  for(let i=1;i<=UI.fut;i++){
    mk=addJMonthKey(mk,1);
    const L=getList('future:'+mk);

      <div class="card-title">${niceJM(mk)} ${pageBadge('future:'+mk)}</div>

      <div class="row">
        <button class="btn sm y" data-act="newentry" data-ctx="future:${mk}">+ افزودن</button>
        <button class="btn sm" data-act="openday" data-k="${mk}-01">رفتن به ماه</button>
      </div>

  }
  return `<div class="card acc flat"><div class="card-title">لاگ آینده <span class="num">Future Log</span></div>
    <div style="font-size:12.5px;font-weight:700;line-height:1.7">چیزهایی که برای ماه‌های بعد برنامه‌ریزی کرده‌ای. وقتی ماهشان برسد، با انتقال ماهانه به لاگ ماهانه می‌آیند.</div>
  </div>${h}

}

/* ---------- فهرست ---------- */
function viewIndex(){
  const rows=[];
  Object.keys(S.daily).filter(k=>(S.daily[k]||[]).length).forEach(k=>rows.push({p:ensurePage('daily:'+k),t:niceJ(k),ty:'daily',ref:'daily:'+k}));
  Object.keys(S.monthly).filter(k=>(S.monthly[k]||[]).length).forEach(k=>rows.push({p:ensurePage('monthly:'+k),t:'لاگ ماهانه '+niceJM(k),ty:'monthly',ref:'monthly:'+k}));
  Object.keys(S.future).filter(k=>(S.future[k]||[]).length).forEach(k=>rows.push({p:ensurePage('future:'+k),t:'لاگ آینده '+niceJM(k),ty:'future',ref:'future:'+k}));
  S.collections.forEach(c=>rows.push({p:ensurePage('col:'+c.id),t:c.title,ty:'col',ref:'col:'+c.id}));
  rows.sort((a,b)=>a.p-b.p);
  const TY={daily:'روزانه',monthly:'ماهانه',future:'آینده',col:'کالکشن'};
  return `<div class="card">
    <div class="card-title">فهرست <span class="num">Index</span></div>
    ${rows.length? rows.map(r=>`<div class="idx" data-act="openref" data-ref="${r.ref}">
      <span class="ty ${r.ty}">${TY[r.ty]}</span><span>${esc(r.t)}</span><span class="lead"></span><span class="pg">${faNum(r.p)}</span>
    </div>`).join('') : emptyBox('فهرست هنوز خالی است')}
  </div>
  <div class="card flat" style="background:#FFFBEC;font-size:12.5px;font-weight:700;line-height:1.7">
    شماره صفحه‌ها به‌ترتیب ساخت اختصاص داده می‌شود — درست مثل دفتر واقعی که هنگام ساخت هر کالکشن جدید،
    شماره صفحه‌اش را در فهرست می‌نویسی.
  </div>`;
}

/* ---------- کالکشن‌ها ---------- */
function viewCollections(){
  return `<div class="card acc flat">
    <div class="card-title">کالکشن‌ها <span class="num">Collections</span></div>
    <div style="font-size:12.5px;font-weight:700;line-height:1.7">مجموعه‌های موضوعی: کتاب‌ها، سفر، پروژه‌ها، سلامت…</div>
  </div>
  ${S.collections.length? S.collections.map(c=>`<button class="card colcard" data-act="open-col" data-id="${c.id}">
      <span class="num" style="background:var(--ink);color:var(--paper);font-size:11px;padding:2px 7px;font-weight:900">${faNum(ensurePage('col:'+c.id))||'—'}</span>
      <span class="t">${esc(c.title)}</span>
      <span class="c">${faNum((c.entries||[]).length)} ردیف</span>

  <button class="btn wide y" data-act="new-col">+ کالکشن جدید</button>`;
}
function viewCollection(id){
  const c=S.collections.find(x=>x.id===id); if(!c){UI.col=null;return viewCollections();}

  return `<button class="btn wide dark" data-act="back">› برگشت به کالکشن‌ها</button>
  <div class="card">
    <div class="card-title">${esc(c.title)} ${pageBadge('col:'+id)}</div>
    ${L.length? L.map(e=>entryHTML(e,'col:'+id)).join('') : emptyBox('این کالکشن خالی است')}

  <div class="row">

}

/* ==========================================================
   شیت‌ها
   ========================================================== */
function openSheet(title,html,mount){
  $('#sheetTitle').textContent=title;
  $('#sheetBody').innerHTML=html;
  $('#sheet').classList.add('open');
  if(mount) mount($('#sheetBody'));
}
function closeSheet(){$('#sheet').classList.remove('open');}

/* ---------- ویرایش / ساخت ورودی ---------- */
let editing=null;
const SYM_ORDER=['task','done','event','note','mig','sched'];
function dayOptions(sel){
  const t=new Date(); let o='';
  for(let i=0;i<14;i++){
    const d=addDays(t,i), k=jkey(d), p=jp(d);
    const lbl = i===0?'امروز' : i===1?'فردا' : `${WDAYS[wdIdx(d)]} ${faNum(p.d)} ${MONTHS[p.m-1]}`;
    o+=`<option value="${k}"${k===sel?' selected':''}>${lbl}</option>`;
  }
  return o;
}
function entryForm(e){
  const symChips=SYM_ORDER.map(v=>`<button class="chip" data-fsym="${v}" aria-pressed="${e.sym===v}">${SYMS[v]} ${SYML[v]}</button>`).join('');
  const sigChips=Object.keys(SIGS).map(k=>`<button class="chip ${SIGS[k].cls}" data-fsig="${k}" aria-pressed="${(e.sig||'')===k}">${SIGS[k].c} ${SIGS[k].l}</button>`).join('');
  const tk=todayKey();
  return `
    <div class="lab">نماد (Signifier)</div><div class="chips" id="fSym">${symChips}</div>
    <div class="lab">نشانه</div><div class="chips" id="fSig">${sigChips}</div>
    <div class="lab">متن</div><textarea id="eText" class="inp" rows="2" placeholder="چی نوشته میشه؟">${esc(e.text)}</textarea>
    <div class="lab">جزئیات / زیر‌نویس (اختیاری)</div><textarea id="eBody" class="inp" rows="3" placeholder="توضیح بیشتر…">${esc(e.body||'')}</textarea>
    <div class="lab">یادآور</div>
    <div class="row">
      <label class="mini"><input type="checkbox" id="eRemOn"${e.rem?' checked':''}> فعال</label>
      <select id="eRemDay" class="inp">${dayOptions(e.rem?e.rem.date:tk)}</select>
      <input type="time" class="inp t" id="eRemT" value="${e.rem?e.rem.time:'09:00'}">
    </div>`;
}
function openEntrySheet(ctx,entry,isNew){
  const e=entry||{id:uid(),sym:'task',sig:null,text:'',body:'',rem:null,createdAt:Date.now()};
  editing={e,ctx,isNew:!!isNew,sym:e.sym,sig:e.sig||null};
  const tm=mkey(new Date());
  const nextM=addJMonthKey(tm,1);
  const colOpts=S.collections.map(c=>`<option value="col:${c.id}">${esc(c.title)}</option>`).join('');
  const moveBlock = isNew ? '' : `
    <div class="lab">انتقال (Migration)</div>
    <div class="chips">
      <button class="chip" data-act="move" data-to="monthly:${tm}">&gt; لاگ ماهانه این ماه</button>
      <button class="chip" data-act="move" data-to="future:${nextM}">&gt; لاگ آینده (${niceJM(nextM)})</button>
      <button class="chip" data-act="move" data-to="daily:${todayKey()}">&lt; امروز</button>
    </div>
    <div class="row">
      <select id="mvCol" class="inp">${colOpts||'<option value="">کالکشنی نیست</option>'}</select>
      <button class="btn sm" data-act="move-col">انتقال به کالکشن</button>
    </div>
    <div class="row"><button class="btn danger grow" data-act="del-entry">حذف ردیف</button></div>`;
  openSheet(isNew?'ثبت جدید':'ویرایش ردیف', entryForm(e)+moveBlock+`
    <div class="row" style="margin-top:14px">
      <button class="btn acc grow" data-act="save-entry">ذخیره</button>
      <button class="btn" data-act="close">انصراف</button>
    </div>`, root=>{
    root.addEventListener('click',ev=>{
      const s=ev.target.closest('[data-fsym]');
      if(s){editing.sym=s.dataset.fsym;$$('#fSym .chip',root).forEach(b=>b.setAttribute('aria-pressed',b.dataset.fsym===editing.sym));return;}
      const g=ev.target.closest('[data-fsig]');
      if(g){const v=g.dataset.fsig;editing.sig=editing.sig===v?null:v;$$('#fSig .chip',root).forEach(b=>b.setAttribute('aria-pressed',b.dataset.fsig===editing.sig));return;}
      if(ev.target.id==='eRemOn'){return;}
    });
    setTimeout(()=>{const t=$('#eText');if(t&&isNew)t.focus();},150);
  });
}
function saveEntry(){
  const e=editing.e;
  e.text=($('#eText').value||'').trim();
  if(!e.text){toast('متن نمی‌تواند خالی باشد');return;}
  e.body=($('#eBody').value||'').trim();
  e.sym=editing.sym; e.sig=editing.sig;
  if($('#eRemOn').checked){
    const d=$('#eRemDay').value, t=$('#eRemT').value||'09:00';
    e.rem = (e.rem && e.rem.date===d && e.rem.time===t) ? e.rem : {date:d,time:t,fired:false};
  } else e.rem=null;
  if(editing.isNew){ e.createdAt=Date.now(); ensureList(editing.ctx).push(e); ensurePage(editing.ctx); }
  save(); closeSheet(); render();
  if(e.rem) toast('یادآور تنظیم شد','برای '+niceJ(e.rem.date)+' ساعت '+faNum(e.rem.time));
}
function moveEntryTo(toCtx){
  const from=editing.ctx, e=editing.e;
  const toType=ctxType(toCtx);
  const srcSym = toType==='daily' ? 'sched' : 'mig';
  const clone={id:uid(),sym:'task',sig:e.sig,text:e.text,body:e.body||'',
    rem:e.rem?{...e.rem,fired:false}:null,createdAt:Date.now(),
    movedFrom:from};
  e.sym=srcSym; e.sig=e.sig; e.movedTo=toCtx;
  ensureList(toCtx).push(clone); ensurePage(toCtx);
  save(); closeSheet(); render();
  toast('منتقل شد','به «'+ctxTitle(toCtx)+'» رفت');
}

/* ---------- انتقال ماهانه ---------- */
function openMigration(){
  const mk=UI.month, items=openMonthItems(mk), nextM=addJMonthKey(mk,1);
  const html = items.length ? items.map(({ctx,e})=>`<div class="ent" style="margin-bottom:8px">
      <span class="sym ${e.sym}">${SYMS[e.sym]}</span>
      <div class="body"><div class="txt">${esc(e.text)}</div>
        <div class="note-body">${ctx==='monthly:'+mk?'لاگ ماهانه':'لاگ روزانه '+niceJ(ctx.split(':')[1])}${e.sig?' · '+SIGS[e.sig].l:''}</div></div>
      <div style="display:flex;flex-direction:column;gap:4px">
        <button class="btn sm g" data-act="mg-done" data-ctx="${ctx}" data-id="${e.id}">✓</button>
        <button class="btn sm y" data-act="mg-mig"  data-ctx="${ctx}" data-id="${e.id}">&gt;</button>
        <button class="btn sm b" data-act="mg-sched" data-ctx="${ctx}" data-id="${e.id}">&lt;</button>
        <button class="btn sm danger" data-act="mg-del" data-ctx="${ctx}" data-id="${e.id}">✕</button>
      </div>
    </div>`).join('')
    : emptyBox('همه‌چیز مرتب است! مورد بازی برای انتقال نیست 🎉');
  openSheet('انتقال ماهانه — '+niceJM(mk),`
    <div class="card flat" style="background:#FFFBEC;font-size:12.5px;font-weight:700;line-height:1.7;margin-bottom:12px">
      ${faNum(items.length)} مورد باز در ${niceJM(mk)}.
      <b>✓</b> انجام شد · <b>&gt;</b> منتقل به لاگ ماهانه ${niceJM(nextM)} · <b>&lt;</b> برنامه‌ریزی در امروز · <b>✕</b> بی‌ربط
    </div>
    ${html}
    ${items.length?`<div class="row"><button class="btn y grow" data-act="mg-all">انتقال همه به ${niceJM(nextM)}</button></div>`:''}
    <div class="row"><button class="btn dark grow" data-act="close">پایان</button></div>`);
}
function findEntry(ctx,id){return getList(ctx).find(e=>e.id===id);}
function mgAction(act,ctx,id){
  const e=findEntry(ctx,id); if(!e)return;
  if(act==='done') e.sym='done';
  else if(act==='del') removeFrom(ctx,id);
  else if(act==='mig'||act==='sched'){
    const to = act==='mig' ? 'monthly:'+addJMonthKey(UI.month,1) : 'daily:'+todayKey();
    const clone={id:uid(),sym:'task',sig:e.sig,text:e.text,body:e.body||'',rem:e.rem?{...e.rem,fired:false}:null,createdAt:Date.now(),movedFrom:ctx};
    e.sym = act==='mig'?'mig':'sched'; e.movedTo=to;
    ensureList(to).push(clone); ensurePage(to);
  }
  save(); openMigration(); render();
}

/* ---------- راهنما ---------- */
function openGuide(){
  const row=(s,l,d)=>`<div class="idx"><span class="sym ${s}" style="width:34px;height:34px;flex:0 0 34px;font-size:19px">${SYMS[s]}</span><span style="font-weight:900">${l}</span><span class="lead"></span><span style="font-size:12px;font-weight:700;color:var(--muted);max-width:46%;text-align:left">${d}</span></div>`;
  openSheet('راهنمای بولت ژورنال',`
    <div class="card"><div class="card-title">نمادها <span class="num">Symbols</span></div>
      ${row('task','وظیفه','کاری که باید انجام بشه')}
      ${row('done','انجام‌شده','وظیفه‌ای که تمام شده')}
      ${row('mig','منتقل‌شده','به ماه/کالکشن بعد رفت')}
      ${row('sched','برنامه‌ریزی‌شده','به یک روز مشخص رفت')}
      ${row('event','رویداد','اتفاقی که می‌افتد')}
      ${row('note','یادداشت','فکت، ایده، مشاهده')}
    </div>
    <div class="card"><div class="card-title">نشانه‌ها <span class="num">Signifiers</span></div>
      <div class="idx"><span class="tag star">★ مهم</span><span class="lead"></span><span style="font-size:12px;font-weight:700;color:var(--muted)">اولویت دارد</span></div>
      <div class="idx"><span class="tag bang">! ایده</span><span class="lead"></span><span style="font-size:12px;font-weight:700;color:var(--muted)">الهام / کشف</span></div>
      <div class="idx"><span class="tag eye">👁 بررسی</span><span class="lead"></span><span style="font-size:12px;font-weight:700;color:var(--muted)">بعداً بیشتر بخوان</span></div>
    </div>
    <div class="card"><div class="card-title">جریان کار <span class="num">Flow</span></div>
      <div style="font-size:13px;font-weight:700;line-height:1.9">
        ۱. <b>ثبت سریع</b> در «امروز» با نماد مناسب<br>
        ۲. رویدادهای ماه در <b>لاگ ماهانه</b><br>
        ۳. کارهای ماه‌های بعد در <b>لاگ آینده</b><br>
        ۴. موضوعات خاص در <b>کالکشن‌ها</b><br>
        ۵. پایان ماه: <b>انتقال ماهانه</b> — مرور و تصمیم برای هر مورد باز<br>
        ۶. همه‌چیز در <b>فهرست</b> با شماره صفحه ثبت می‌شود
      </div>
    </div>
    <div class="row"><button class="btn dark grow" data-act="close">فهمیدم</button></div>`);
  S.seenGuide=true; save();
}

/* ---------- تنظیمات ---------- */
function openSettings(){
  const st=S.settings;
  const perm=('Notification' in window)?Notification.permission:'unsupported';
  const permTxt={granted:'فعال ✓',denied:'مسدود شده',default:'درخواست نشده',unsupported:'پشتیبانی نمی‌شود'}[perm];
  const accs=[['orange','نارنجی'],['blue','آبی'],['pink','صورتی'],['green','سبز'],['black','مشکی']];
  openSheet('تنظیمات',`
    <div class="card"><div class="card-title">اعلان‌ها <span class="num">Notifications</span></div>
      <div class="row" style="margin-top:0">
        <span class="mini">وضعیت: <b>${permTxt}</b></span>
        <button class="btn sm acc" id="permBtn">درخواست دسترسی</button>
      </div>
      ${perm==='unsupported'||location.protocol==='file:'?`<div class="note-body" style="background:#FFF3CD;border:2px solid var(--ink);padding:8px;margin-top:8px">
        برای اطمینان از کارکرد اعلان‌ها، صفحه را از طریق <b>http://localhost</b> یا یک سایت https باز کن (نه فایل مستقیم).
      </div>`:''}
      <div class="row"><button class="btn sm y" id="testNotif">ارسال اعلان تست</button>
        <label class="mini"><input type="checkbox" id="snd"${st.sound?' checked':''}> صدا</label></div>
    </div>
    <div class="card"><div class="card-title">یادآور روزانه <span class="num">Daily</span></div>
      <div class="row" style="margin-top:0">
        <label class="mini"><input type="checkbox" id="drOn"${st.dailyRem.on?' checked':''}> فعال</label>
        <input type="time" class="inp t" id="drT" value="${st.dailyRem.time}">
      </div>
      <div class="note-body">هر روز در این ساعت یادآوری می‌کند که لاگ امروزت را بنویسی و کارهای باز را مرور کنی.</div>
    </div>
    <div class="card"><div class="card-title">رنگ اصلی</div>
      <div class="chips">${accs.map(([v,l])=>`<button class="chip" data-accent="${v}" aria-pressed="${st.accent===v}">${l}</button>`).join('')}</div>
    </div>
    <div class="card"><div class="card-title">پشتیبان‌گیری <span class="num">Backup</span></div>
      <div class="row" style="margin-top:0">
        <button class="btn sm g" id="expBtn">خروجی JSON</button>
        <button class="btn sm" id="impBtn">بازیابی</button>
        <input type="file" id="impFile" accept="application/json" style="display:none">
      </div>
      <div class="note-body">همه‌چیز روی همین دستگاه ذخیره می‌شود. برای اطمینان، گاهی خروجی بگیر.</div>
    </div>
    <div class="row"><button class="btn danger grow" id="wipeBtn">پاک کردن همه داده‌ها</button></div>
  `, root=>{
    $('#permBtn',root).onclick=async()=>{
      if(!('Notification' in window)){toast('این مرورگر اعلان ندارد');return;}
      const r=await Notification.requestPermission();
      toast(r==='granted'?'دسترسی اعلان داده شد':'دسترسی رد شد: '+r);
      closeSheet(); openSettings();
    };
    $('#testNotif',root).onclick=()=>notify('تست بولت ژورنال','اگر این را می‌بینی، اعلان‌ها کار می‌کنند ✓');
    $('#snd',root).onchange=e=>{S.settings.sound=e.target.checked;save();};
    $('#drOn',root).onchange=e=>{S.settings.dailyRem.on=e.target.checked;save();};
    $('#drT',root).onchange=e=>{S.settings.dailyRem.time=e.target.value;save();};
    $$('[data-accent]',root).forEach(b=>b.onclick=()=>{
      S.settings.accent=b.dataset.accent; document.documentElement.dataset.accent=b.dataset.accent;
      $$('[data-accent]',root).forEach(x=>x.setAttribute('aria-pressed',x.dataset.accent===b.dataset.accent));
      save();
    });
    $('#expBtn',root).onclick=()=>{
      const blob=new Blob([JSON.stringify(S,null,2)],{type:'application/json'});
      const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
      a.download='bujo-backup-'+todayKey()+'.json'; a.click();
      toast('فایل خروجی ساخته شد');
    };
    $('#impBtn',root).onclick=()=>$('#impFile',root).click();
    $('#impFile',root).onchange=ev=>{
      const f=ev.target.files[0]; if(!f)return;
      const r=new FileReader();
      r.onload=()=>{try{const o=JSON.parse(r.result);if(!o||typeof o!=='object')throw 0;
        localStorage.setItem(KEY,JSON.stringify(o));location.reload();}catch(e){toast('فایل نامعتبر است');}};
      r.readAsText(f);
    };
    $('#wipeBtn',root).onclick=()=>{ if(confirm('همه داده‌ها پاک شود؟ این کار برگشت‌ناپذیر است.')){localStorage.removeItem(KEY);location.reload();} };
  });
}

/* ==========================================================
   اعلان‌ها و یادآورها
   ========================================================== */
let toastT=null;
function toast(msg,sub){
  const t=$('#toast');
  t.innerHTML=esc(msg)+(sub?'<span class="s">'+esc(sub)+'</span>':'');
  t.classList.add('show');
  clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),3600);
}
function beep(){
  if(!S.settings.sound)return;
  try{
    const C=window.AudioContext||window.webkitAudioContext; if(!C)return;
    const c=new C(), o=c.createOscillator(), g=c.createGain();
    o.type='square'; o.frequency.value=680; g.gain.value=.05;
    o.connect(g); g.connect(c.destination); o.start();
    setTimeout(()=>{o.stop();c.close();},260);
  }catch(e){}
}
const ICON='data:image/svg+xml,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><rect width="64" height="64" fill="#FFD400"/><rect x="6" y="6" width="52" height="52" fill="none" stroke="#111" stroke-width="6"/><circle cx="32" cy="32" r="12" fill="#FF5C00"/></svg>');
function notify(title,body){
  toast(title,body); beep();
  if(navigator.vibrate) try{navigator.vibrate([60,50,60]);}catch(e){}
  if(!('Notification' in window)) return;
  if(Notification.permission==='granted'){
    try{ new Notification(title,{body:body,icon:ICON,badge:ICON,tag:'bujo-'+Date.now(),requireInteraction:true}); }catch(e){}
  }
}
function allEntries(){
  const out=[];
  Object.keys(S.daily).forEach(k=>S.daily[k].forEach(e=>out.push(e)));
  Object.keys(S.monthly).forEach(k=>S.monthly[k].forEach(e=>out.push(e)));
  Object.keys(S.future).forEach(k=>S.future[k].forEach(e=>out.push(e)));
  S.collections.forEach(c=>(c.entries||[]).forEach(e=>out.push(e)));
  return out;
}
function tick(){
  const now=new Date(), tk=todayKey(), m=now.getHours()*60+now.getMinutes();
  let fired=0;
  allEntries().forEach(e=>{
    if(!e.rem || e.rem.fired) return;
    const due = (e.rem.date < tk) || (e.rem.date===tk && toMin(e.rem.time)<=m);
    if(due){ e.rem.fired=true; fired++; notify('⏰ '+e.text, (e.body?e.body+'\n':'')+'یادآور '+niceJ(e.rem.date)+' — ساعت '+faNum(e.rem.time)); }
  });
  const dr=S.settings.dailyRem;
  if(dr.on && dr.last!==tk && toMin(dr.time)<=m){
    const open=allEntries().filter(e=>e.sym==='task'&&(!e.rem||e.rem.date===tk)).length;
    dr.last=tk; fired++;
    notify('📓 وقت لاگ امروز است', open? faNum(open)+' کار باز داری — چند دقیقه برای مرور روز وقت بگذار.' : 'امروز را بنویس.');
  }
  if(fired){ save(); if(UI.tab==='daily'&&$('#view').dataset.live) render(); }
}
const toMin=t=>{const[h,m]=(t||'00:00').split(':').map(Number);return h*60+m;};
setInterval(tick,15000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)tick();});

/* ==========================================================
   رویدادها
   ========================================================== */
document.addEventListener('click',ev=>{
  /* تب‌ها */
  const tab=ev.target.closest('.tab');
  if(tab){ UI.tab=tab.dataset.tab; if(tab.dataset.tab!=='collections') UI.col=null; render(); window.scrollTo(0,0); return; }

  /* چیپ‌های ثبت سریع */
  const cs=ev.target.closest('[data-sym]');
  if(cs){ compSym=cs.dataset.sym; $$('[data-sym]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.sym===compSym)); return; }
  const cg=ev.target.closest('[data-sig]');
  if(cg){ const v=cg.dataset.sig; compSig = compSig===v?null:v; $$('[data-sig]').forEach(b=>b.setAttribute('aria-pressed',(compSig||'')===b.dataset.sig)); return; }

  const el=ev.target.closest('[data-act]'); if(!el) return;
  const a=el.dataset.act;

  switch(a){
    case 'close': closeSheet(); break;

    /* ---- روزانه ---- */
    case 'add': {
      const t=$('#q'); const txt=(t?t.value:'').trim();
      if(!txt){ toast('اول چیزی بنویس'); if(t)t.focus(); break; }
      const ctx='daily:'+UI.day;
      const e={id:uid(),sym:compSym,sig:compSig,text:txt,body:'',createdAt:Date.now(),rem:null};
      if($('#remOn') && $('#remOn').checked){
        /* اگر روزِ در حالِ مشاهده گذشته باشد، یادآور روی امروز تنظیم می‌شود */
        const d = UI.day < todayKey() ? todayKey() : UI.day;
        e.rem={date:d, time:$('#remT').value||'09:00', fired:false};
      }
      ensureList(ctx).push(e); ensurePage(ctx);
      save(); render();
      if(e.rem) toast('یادآور تنظیم شد', niceJ(e.rem.date)+' · ساعت '+faNum(e.rem.time));
      break;
    }
    case 'day-prev': UI.day=jkey(addDays(fromKey(UI.day),-1)); render(); break;
    case 'day-next': UI.day=jkey(addDays(fromKey(UI.day),1)); render(); break;
    case 'day-today': UI.day=todayKey(); render(); break;
    case 'pick-day': UI.day=el.dataset.k; UI.tab='daily'; render(); window.scrollTo(0,0); break;
    case 'openday': { const k=el.dataset.k; UI.month=k.slice(0,7); UI.day=k; UI.tab='daily'; render(); window.scrollTo(0,0); break; }

    /* ---- ماهانه ---- */
    case 'mon-prev': UI.month=addJMonthKey(UI.month,-1); render(); break;
    case 'mon-next': UI.month=addJMonthKey(UI.month,1); render(); break;
    case 'migrate': openMigration(); break;
    case 'mg-done': mgAction('done',el.dataset.ctx,el.dataset.id); break;
    case 'mg-mig':  mgAction('mig', el.dataset.ctx,el.dataset.id); break;
    case 'mg-sched':mgAction('sched',el.dataset.ctx,el.dataset.id); break;
    case 'mg-del':  mgAction('del', el.dataset.ctx,el.dataset.id); break;
    case 'mg-all': {
      const nextM=addJMonthKey(UI.month,1);
      openMonthItems(UI.month).forEach(({ctx,e})=>{
        const clone={id:uid(),sym:'task',sig:e.sig,text:e.text,body:e.body||'',rem:e.rem?{...e.rem,fired:false}:null,createdAt:Date.now(),movedFrom:ctx};
        e.sym='mig'; e.movedTo='monthly:'+nextM;
        ensureList('monthly:'+nextM).push(clone);
      });
      ensurePage('monthly:'+nextM); save(); openMigration(); render();
      toast('همه منتقل شدند','به لاگ ماهانه '+niceJM(nextM));
      break;
    }

    /* ---- آینده / افزودن ---- */
    case 'fut-more': UI.fut+=6; render(); break;
    case 'newentry': openEntrySheet(el.dataset.ctx,null,true); break;
    case 'miniadd': {
      const inp=el.closest('.minic').querySelector('input');
      const txt=(inp.value||'').trim(); if(!txt){toast('اول چیزی بنویس');break;}
      const ctx=el.dataset.ctx;
      ensureList(ctx).push({id:uid(),sym:'task',sig:null,text:txt,body:'',rem:null,createdAt:Date.now()});
      ensurePage(ctx); save(); render();
      break;
    }

    /* ---- ورودی ---- */
    case 'toggle': {
      const row=el.closest('.ent'); const e=findEntry(row.dataset.ctx,row.dataset.id); if(!e)break;
      if(e.sym==='task') e.sym='done'; else if(e.sym==='done') e.sym='task';
      else if(e.sym==='event') e.sym='note'; else if(e.sym==='note') e.sym='event';
      else e.sym='task';
      save(); render();
      break;
    }
    case 'edit': {
      const row=el.closest('.ent'); const e=findEntry(row.dataset.ctx,row.dataset.id); if(!e)break;
      /* باید ارجاعِ خودِ ردیف فرستاده شود، نه یک کپی — وگرنه تغییرات ذخیره نمی‌شوند */
      openEntrySheet(row.dataset.ctx,e,false);
      break;
    }
    case 'save-entry': saveEntry(); break;
    case 'del-entry': {
      removeFrom(editing.ctx,editing.e.id); save(); closeSheet(); render(); toast('ردیف حذف شد');
      break;
    }
    case 'move': moveEntryTo(el.dataset.to); break;
    case 'move-col': {
      const v=$('#mvCol').value; if(!v||v.indexOf('col:')!==0){toast('کالکشنی انتخاب نشده');break;}
      moveEntryTo(v); break;
    }

    /* ---- فهرست ---- */
    case 'openref': {
      const ref=el.dataset.ref, t=ctxType(ref);
      if(t==='daily'){UI.day=ref.split(':')[1];UI.tab='daily';}
      else if(t==='monthly'){UI.month=ref.split(':')[1];UI.tab='monthly';}
      else if(t==='future'){UI.tab='future';}
      else {UI.col=ref.split(':')[1];UI.tab='collections';}
      render(); window.scrollTo(0,0); break;
    }

    /* ---- کالکشن‌ها ---- */
    case 'open-col': UI.col=el.dataset.id; render(); break;
    case 'back': UI.col=null; render(); break;
    case 'new-col': {
      const n=prompt('نام کالکشن جدید:'); if(!n)break;
      const c={id:uid(),title:n.trim(),entries:[]}; S.collections.push(c); ensurePage('col:'+c.id);
      save(); UI.col=c.id; render(); break;
    }
    case 'rename-col': {
      const c=S.collections.find(x=>x.id===el.dataset.id); if(!c)break;
      const n=prompt('نام جدید:',c.title); if(n===null)break;
      c.title=n.trim()||c.title; save(); render(); break;
    }
    case 'del-col': {
      const c=S.collections.find(x=>x.id===el.dataset.id); if(!c)break;
      if(!confirm('کالکشن «'+c.title+'» حذف شود؟'))break;
      S.collections=S.collections.filter(x=>x.id!==c.id); UI.col=null; save(); render(); break;
    }

    /* ---- سربرگ ---- */
    case 'guide': openGuide(); break;
    case 'settings': openSettings(); break;
    case 'notif': {
      if('Notification' in window && Notification.permission==='default'){
        Notification.requestPermission().then(r=>toast(r==='granted'?'دسترسی اعلان داده شد ✓':'دسترسی رد شد'));
      } else openSettings();
      break;
    }
  }
});

/* Enter برای ثبت سریع */
document.addEventListener('keydown',ev=>{
  if(ev.key==='Enter' && ev.target.id==='q' && !ev.shiftKey){ ev.preventDefault();
    const b=document.querySelector('[data-act="add"]'); if(b)b.click(); }
  if(ev.key==='Escape') closeSheet();
});

/* ==========================================================
   شروع
   ========================================================== */
document.documentElement.dataset.accent=S.settings.accent||'orange';
$('#view').dataset.live='1';
render();
tick();
if(!S.seenGuide) setTimeout(openGuide,400);
/* نگه‌داشتن زمان: هر دقیقه بررسی */
setInterval(()=>{ if(new Date().getSeconds()<20) tick(); },60000);
</script>
